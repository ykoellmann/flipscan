# Copy to ~/.config/flipscan/config.toml (or run `flipscan init-config`)
scanner = "airscan:e0:Your Scanner"   # SANE device id, see `scanimage -L`
dpi = 300
page_width_mm = 210
# Scan height. Some ADFs jam or cut off at the full A4 length (297); if so,
# lower it (e.g. 290). Override per run: flipscan scan --height 290
page_height_mm = 297
scan_format = "jpeg"              # jpeg | png | tiff
# Rotation applied to back sides (0 | 90 | 180 | 270). Depends on how you flip the
# stack; override per run: flipscan scan --back-rotation 180
back_rotation = 0
sessions_dir = "~/Scans/sessions"

[upload]
backend = "folder"                # folder | scp | paperless
# folder: copy into a (mounted) Paperless consume directory
path = "~/paperless/consume"
# scp:
# host = "myserver"
# user = "me"
# path = "/srv/paperless/consume"
# paperless API:
# url = "http://paperless:8000"
# token = "..."
