<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flipscan Review</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><b>Flipscan</b> <span id="info"></span>
<span class="keys">←→ navigate · c cut · x delete · r rotate · R rotate all backs 180° · u undo · n name · B delete blanks · C accept suggested cuts · space zoom</span>
<button id="done"></button><button id="export">Export</button><button id="upload">Export + upload</button></header>
<div id="layout">
  <aside id="sessions"></aside>
  <main id="strip"></main>
  <aside id="preview"><div id="pv-meta"></div><div id="pv-img"><img alt=""></div></aside>
</div>
<div id="zoom" hidden><img></div>
<div id="toast" hidden></div>
<script src="/static/app.js"></script></body></html>
