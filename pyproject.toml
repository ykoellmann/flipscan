[project]
name = "flipscan"
version = "0.1.0"
description = "Scan a stack, flip it, scan again - review and upload to Paperless-ngx"
requires-python = ">=3.11"
dependencies = ["flask", "img2pdf", "pillow"]

[project.scripts]
flipscan = "flipscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
flipscan = ["static/*", "config.example.toml"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
